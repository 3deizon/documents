<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3DÉIZON — Réunion de lancement</title>
<style>
:root{--ink:#0E0E0F;--ivory:#F5F2EC;--bronze:#9A6B4B;--stone:#A39B8F;--muted:#6B655D;--line:rgba(20,20,20,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:620px;margin:0 auto;padding:28px 16px 120px}
img.logo{height:22px}
h1{font-size:32px;line-height:1.06;letter-spacing:-.022em;font-weight:600;margin:28px 0 8px}
h1 span{color:var(--bronze)}
p.sous{color:var(--muted);margin:0 0 18px}
.jour{margin-top:22px}
.jour h3{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin:0 0 8px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.c{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;user-select:none}
.c b{display:block;font-size:17px;font-weight:600}
.c small{display:block;font-size:11px;color:var(--muted)}
.c.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.c.on small{color:rgba(255,255,255,.7)}
.c.off{opacity:.35;cursor:not-allowed}
.barre{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px}
.barre .in{max-width:620px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.barre span{font-size:14px;color:var(--muted)}
button{border:0;border-radius:8px;background:var(--bronze);color:#fff;font:600 16px -apple-system,sans-serif;padding:13px 18px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:18px}
</style>
</head>
<body>
<main>
  <img class="logo" src="https://assets.zyrosite.com/cdn-cgi/image/format=png,w=600/A1aev9vl9af974Jg/logo-3deizon-noir-YD0rMeDn6VCoEQDG.png" alt="3DÉIZON">
  <h1 id="titre"></h1>
  <p class="sous" id="sous"></p>
  <div id="zone"></div>
</main>
<div class="barre" id="barre" hidden><div class="in"><span id="compte"></span><button id="envoyer" disabled></button></div></div>
<script>
const API = "https://projet.j-a-3e2.workers.dev/api";
const q = new URLSearchParams(location.search), d = q.get("d"), s = q.get("s");
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let L = "fr", choix = [];
const T = {
  fr: { titre: 'Réunion de <span>lancement</span>', sous: n => `${n ? n + ", c" : "C"}hoisissez 3 créneaux différents pour notre visio de 45 minutes. Les horaires sont à votre heure locale (${tz}). Nous confirmons l'un d'eux très vite.`,
        compte: n => `${n} / 3 créneaux choisis`, bouton: "Proposer ces 3 créneaux", merci: "Merci ! Vos 3 créneaux sont bien reçus. Vous recevrez la confirmation par email.",
        pris: "Un créneau vient d'être pris. Les disponibilités sont mises à jour : merci de refaire votre choix.", lien: "Ce lien n'est pas valide. Écrivez-nous sur WhatsApp : +261 34 88 032 77.",
        vide: "Aucun créneau disponible pour le moment. Écrivez-nous sur WhatsApp : +261 34 88 032 77.", dubai: "Dubaï", loc: "fr-FR" },
  en: { titre: 'Kick-off <span>meeting</span>', sous: n => `${n ? n + ", p" : "P"}ick 3 different time slots for our 45-minute video call. Times are shown in your local time (${tz}). We'll confirm one of them shortly.`,
        compte: n => `${n} / 3 slots selected`, bouton: "Propose these 3 slots", merci: "Thank you! Your 3 slots have been received. You'll get the confirmation by email.",
        pris: "A slot has just been taken. Availability has been refreshed: please pick again.", lien: "This link is not valid. Message us on WhatsApp: +261 34 88 032 77.",
        vide: "No slot available at the moment. Message us on WhatsApp: +261 34 88 032 77.", dubai: "Dubai", loc: "en-GB" }
};
const $ = id => document.getElementById(id);
function heure(iso, zone) { return new Date(iso).toLocaleTimeString(T[L].loc, { hour: "2-digit", minute: "2-digit", timeZone: zone }); }
function majBarre() {
  $("compte").textContent = T[L].compte(choix.length);
  $("envoyer").disabled = choix.length !== 3;
  document.querySelectorAll(".c").forEach(e => {
    const on = choix.includes(e.dataset.iso);
    e.classList.toggle("on", on);
    e.classList.toggle("off", !on && choix.length >= 3);
  });
}
async function charger() {
  const r = await fetch(`${API}/creneaux?d=${encodeURIComponent(d)}&s=${encodeURIComponent(s)}`);
  if (!r.ok) { $("zone").innerHTML = `<div class="msg">${T[L].lien}</div>`; return; }
  const o = await r.json(); L = o.langue === "FR" ? "fr" : "en"; document.documentElement.lang = L;
  $("titre").innerHTML = T[L].titre; $("sous").textContent = T[L].sous(o.prenom);
  $("envoyer").textContent = T[L].bouton;
  if (!o.creneaux.length) { $("zone").innerHTML = `<div class="msg">${T[L].vide}</div>`; return; }
  const jours = {};
  for (const iso of o.creneaux) {
    const cle = new Date(iso).toLocaleDateString(T[L].loc, { weekday: "long", day: "numeric", month: "long", timeZone: tz });
    (jours[cle] = jours[cle] || []).push(iso);
  }
  choix = choix.filter(c => o.creneaux.includes(c));
  $("zone").innerHTML = Object.entries(jours).map(([j, l]) => `<div class="jour"><h3>${j}</h3><div class="grille">${
    l.map(iso => `<div class="c" data-iso="${iso}"><b>${heure(iso, tz)}</b><small>${heure(iso, "Asia/Dubai")} ${T[L].dubai}</small></div>`).join("")}</div></div>`).join("");
  document.querySelectorAll(".c").forEach(e => e.onclick = () => {
    const i = choix.indexOf(e.dataset.iso);
    if (i >= 0) choix.splice(i, 1); else if (choix.length < 3) choix.push(e.dataset.iso);
    majBarre();
  });
  $("barre").hidden = false; majBarre();
}
$("envoyer").onclick = async () => {
  $("envoyer").disabled = true;
  const r = await fetch(`${API}/rdv`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ d, s, creneaux: choix, tz }) });
  if (r.ok) { $("barre").hidden = true; $("zone").innerHTML = `<div class="msg">${T[L].merci}</div>`; window.scrollTo(0, 0); }
  else if (r.status === 409) { alert(T[L].pris); await charger(); }
  else { $("envoyer").disabled = false; alert(T[L].lien); }
};
charger();
</script>
</body>
</html>
