<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3DÉIZON — Merci</title>
<style>
:root{--ink:#0E0E0F;--ivory:#F5F2EC;--bronze:#9A6B4B;--muted:#6B655D}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 56px}
img{height:22px;display:block}
h1{font-size:34px;line-height:1.06;letter-spacing:-.022em;font-weight:600;margin:36px 0 10px}
h1 span{color:var(--bronze)}
p{color:var(--muted)}
a.bt{display:block;margin-top:28px;padding:15px;border-radius:8px;background:var(--bronze);color:#fff;text-align:center;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="https://assets.zyrosite.com/cdn-cgi/image/format=png,w=600/A1aev9vl9af974Jg/logo-3deizon-noir-YD0rMeDn6VCoEQDG.png" alt="3DÉIZON">
  <h1 id="h"></h1>
  <p id="p"></p>
  <a class="bt" id="a" href="https://wa.me/261348803277"></a>
</main>
<script>
const fr = (new URLSearchParams(location.search).get("lang") || navigator.language || "").toLowerCase().startsWith("fr");
document.documentElement.lang = fr ? "fr" : "en";
document.getElementById("h").innerHTML = fr ? "Merci, votre projet est <span>bien reçu.</span>" : "Thank you, we've <span>received your project.</span>";
document.getElementById("p").textContent = fr ? "Vous recevez notre plaquette par email dans quelques minutes. Pour aller plus vite, écrivez-nous sur WhatsApp."
  : "Our brochure is on its way to your inbox. To speed things up, message us on WhatsApp.";
document.getElementById("a").textContent = fr ? "Écrire sur WhatsApp" : "Message us on WhatsApp";
</script>
</body>
</html>
